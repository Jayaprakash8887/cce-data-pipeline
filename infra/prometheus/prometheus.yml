global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # PeerDB (stable-v0.36.26) exports telemetry via OpenTelemetry, not a built-in
  # Prometheus endpoint. To scrape it, run an OTel collector with a Prometheus
  # exporter, set PEERDB_OTEL_METRICS_* on the flow services, and point this job
  # at the collector. Disabled so Prometheus does not error against a dead target.
  # - job_name: peerdb
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ['otel-collector:8889']

  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets:
          - clickhouse:9363
