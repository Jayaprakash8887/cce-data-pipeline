global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: kafka-connect
    metrics_path: /metrics
    static_configs:
      - targets:
          - kafka-connect:8083

  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets:
          - clickhouse:9363

  - job_name: kafka
    metrics_path: /metrics
    static_configs:
      - targets:
          - kafka:9308
