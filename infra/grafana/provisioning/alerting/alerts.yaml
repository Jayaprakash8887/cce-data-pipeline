apiVersion: 1

groups:
  - orgId: 1
    name: CCE Pipeline Alerts
    folder: CCE Data Pipeline
    interval: 60s
    rules:
      - uid: cdc-sink-connector-down
        title: "CDC Sink Connector Down"
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: "kafka_connect_connector_status{connector=\"cce-clickhouse-sink\"} != 1"
              intervalMs: 60000
        for: 5m
        annotations:
          summary: "ClickHouse sink connector is not running"
          description: "Connector status: {{ $value }}"
        labels:
          severity: critical

      - uid: kafka-consumer-lag-high
        title: "Kafka Consumer Lag High"
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: "sum(kafka_consumer_group_lag{group=~\"cce-.*\"}) by (topic) > 10000"
              intervalMs: 60000
        for: 10m
        annotations:
          summary: "Kafka consumer lag exceeds 10k for topic {{ $labels.topic }}"
        labels:
          severity: warning

      - uid: e2e-latency-high
        title: "End-to-End Latency High"
        condition: A
        data:
          - refId: A
            datasourceUid: clickhouse
            model:
              rawSql: "SELECT quantile(0.95)(dateDiff('second', event_time, received_at)) FROM cce_analytics.inbound_event_logs WHERE received_at >= now() - INTERVAL 5 MINUTE AND event_time IS NOT NULL"
        for: 5m
        annotations:
          summary: "P95 end-to-end latency exceeds 60 seconds"
        labels:
          severity: warning

      - uid: clickhouse-disk-full
        title: "ClickHouse Disk > 85%"
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: "ClickHouseAsyncMetrics_DiskUsed_default / ClickHouseAsyncMetrics_DiskTotal_default * 100 > 85"
              intervalMs: 60000
        for: 5m
        annotations:
          summary: "ClickHouse disk usage exceeds 85%"
        labels:
          severity: critical

      - uid: cdc-replication-lag
        title: "CDC Replication Lag High"
        condition: A
        data:
          - refId: A
            datasourceUid: postgresql
            model:
              rawSql: "SELECT pg_wal_lsn_diff(pg_current_wal_lsn(), confirmed_flush_lsn) FROM pg_replication_slots WHERE slot_name = 'cce_analytics_slot'"
        for: 10m
        annotations:
          summary: "CDC replication slot lag exceeds 100MB"
        labels:
          severity: warning

      - uid: dlq-messages
        title: "DLQ Messages Detected"
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: "sum(kafka_consumer_group_lag{topic=~\".*\\.dlq\"}) > 0"
              intervalMs: 60000
        for: 2m
        annotations:
          summary: "Dead letter queue has messages on {{ $labels.topic }}"
        labels:
          severity: warning
