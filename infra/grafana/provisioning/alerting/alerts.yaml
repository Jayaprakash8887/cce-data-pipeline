apiVersion: 1

groups:
  - orgId: 1
    name: CCE Pipeline Alerts
    folder: CCE Data Pipeline
    interval: 60s
    rules:
      - uid: peerdb-mirror-not-running
        title: "PeerDB Mirror Not Running"
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: "peerdb_flow_status{flow_name=\"cce_analytics_mirror\"} != 1"
              intervalMs: 60000
        for: 5m
        annotations:
          summary: "PeerDB CDC mirror is not running"
          description: "Mirror status: {{ $value }} (0=error, 1=running, 2=paused)"
        labels:
          severity: critical

      - uid: peerdb-cdc-lag-high
        title: "PeerDB CDC Lag High"
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: "peerdb_cdc_lag_seconds{flow_name=\"cce_analytics_mirror\"} > 60"
              intervalMs: 60000
        for: 10m
        annotations:
          summary: "PeerDB CDC lag exceeds 60 seconds"
        labels:
          severity: warning

      - uid: e2e-latency-high
        title: "End-to-End Latency High"
        condition: A
        data:
          - refId: A
            datasourceUid: clickhouse
            model:
              rawSql: "SELECT quantile(0.95)(dateDiff('second', event_time, received_at)) FROM cce_analytics.inbound_event_logs WHERE received_at >= now() - INTERVAL 5 MINUTE AND event_time IS NOT NULL"
        for: 5m
        annotations:
          summary: "P95 end-to-end latency exceeds 60 seconds"
        labels:
          severity: warning

      - uid: clickhouse-disk-full
        title: "ClickHouse Disk > 85%"
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: "ClickHouseAsyncMetrics_DiskUsed_default / ClickHouseAsyncMetrics_DiskTotal_default * 100 > 85"
              intervalMs: 60000
        for: 5m
        annotations:
          summary: "ClickHouse disk usage exceeds 85%"
        labels:
          severity: critical

      - uid: cdc-replication-lag
        title: "CDC Replication Lag High"
        condition: A
        data:
          - refId: A
            datasourceUid: postgresql
            model:
              rawSql: "SELECT pg_wal_lsn_diff(pg_current_wal_lsn(), confirmed_flush_lsn) FROM pg_replication_slots WHERE slot_name = 'cce_analytics_slot'"
        for: 10m
        annotations:
          summary: "CDC replication slot lag exceeds 100MB"
        labels:
          severity: warning

      - uid: peerdb-sync-errors
        title: "PeerDB Sync Errors"
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: "increase(peerdb_sync_errors_total{flow_name=\"cce_analytics_mirror\"}[5m]) > 0"
              intervalMs: 60000
        for: 2m
        annotations:
          summary: "PeerDB mirror encountered sync errors"
        labels:
          severity: warning
