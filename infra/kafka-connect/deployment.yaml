apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: cce-data-pipeline
  labels:
    app: kafka-connect
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kafka-connect
  template:
    metadata:
      labels:
        app: kafka-connect
    spec:
      containers:
      - name: kafka-connect
        image: registry.internal/cce/kafka-connect:latest
        ports:
        - containerPort: 8083
          name: rest
        env:
        - name: CONNECT_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: kafka-connect-config
              key: bootstrap.servers
        - name: CONNECT_REST_PORT
          value: "8083"
        - name: CONNECT_GROUP_ID
          value: cce-data-pipeline-connect
        - name: CONNECT_CONFIG_STORAGE_TOPIC
          value: _cce-connect-configs
        - name: CONNECT_OFFSET_STORAGE_TOPIC
          value: _cce-connect-offsets
        - name: CONNECT_STATUS_STORAGE_TOPIC
          value: _cce-connect-status
        - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
          value: "3"
        - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
          value: "3"
        - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
          value: "3"
        - name: CONNECT_KEY_CONVERTER
          value: org.apache.kafka.connect.json.JsonConverter
        - name: CONNECT_VALUE_CONVERTER
          value: org.apache.kafka.connect.json.JsonConverter
        - name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE
          value: "false"
        - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
          value: "false"
        - name: CONNECT_PLUGIN_PATH
          value: /usr/share/confluent-hub-components
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /connectors
            port: 8083
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /connectors
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: cce-data-pipeline
spec:
  selector:
    app: kafka-connect
  ports:
  - port: 8083
    targetPort: 8083
    name: rest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-connect-config
  namespace: cce-data-pipeline
data:
  bootstrap.servers: "kafka-broker-0.kafka:9092,kafka-broker-1.kafka:9092,kafka-broker-2.kafka:9092"
