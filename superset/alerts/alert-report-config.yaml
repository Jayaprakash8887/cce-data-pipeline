# CCE Data Pipeline — Superset Alert & Report Configurations
# Import via Superset Admin → Alerts & Reports or API

alerts:
  - name: "High Deviation Rate"
    description: "More than 50 deviations in the last hour"
    sql: |
      SELECT count() AS deviation_count
      FROM deviations
      WHERE detected_at >= now() - INTERVAL 1 HOUR
    threshold: 50
    condition: "> (greater than)"
    frequency: "*/10 * * * *"  # every 10 minutes
    recipients:
      - type: email
        target: clinical-supervisors@example.com
    grace_period: 3600  # don't re-alert for 1 hour

  - name: "Source Quality Drop"
    description: "Acceptance rate below 70% in last hour"
    sql: |
      SELECT round(
        countIf(status = 'ACCEPTED') / nullIf(count(), 0) * 100, 1
      ) AS acceptance_rate
      FROM inbound_events
      WHERE received_at >= now() - INTERVAL 1 HOUR
    threshold: 70
    condition: "< (less than)"
    frequency: "*/15 * * * *"
    recipients:
      - type: email
        target: integration-team@example.com

  - name: "Zero Events Alert"
    description: "No events received in 30 minutes"
    sql: |
      SELECT count() AS event_count
      FROM inbound_event_logs
      WHERE received_at >= now() - INTERVAL 30 MINUTE
    threshold: 1
    condition: "< (less than)"
    frequency: "*/5 * * * *"
    recipients:
      - type: email
        target: oncall@example.com

  - name: "Adaptor Failure Spike"
    description: "Adaptor success rate below 80% in last hour"
    sql: |
      SELECT round(
        countIfMerge(delivered) / nullIf(countMerge(total_deliveries), 0) * 100, 1
      ) AS success_rate
      FROM mv_delivery_performance_hourly
      WHERE hour >= now() - INTERVAL 1 HOUR
    threshold: 80
    condition: "< (less than)"
    frequency: "*/10 * * * *"
    recipients:
      - type: email
        target: integration-team@example.com

  - name: "Adaptor Down"
    description: "Zero deliveries from any adaptor in 30 minutes"
    sql: |
      SELECT count() AS delivery_count
      FROM intelligence_deliveries FINAL
      WHERE created_at >= now() - INTERVAL 30 MINUTE
    threshold: 1
    condition: "< (less than)"
    frequency: "*/10 * * * *"
    recipients:
      - type: email
        target: oncall@example.com

reports:
  - name: "Weekly Compliance Summary"
    description: "Protocol compliance rates by facility"
    dashboard: "Compliance Monitoring"
    schedule: "0 8 * * 1"  # Monday 8 AM
    format: PDF
    recipients:
      - type: email
        target: clinical-managers@example.com

  - name: "Daily Deviation Alert"
    description: "Previous day's deviations summary"
    dashboard: "Deviation Analytics"
    schedule: "0 7 * * *"  # Daily 7 AM
    format: email_inline
    recipients:
      - type: email
        target: supervisors@example.com

  - name: "Monthly Facility Ranking"
    description: "Monthly compliance ranking by facility"
    dashboard: "Facility Performance"
    schedule: "0 8 1 * *"  # 1st of month, 8 AM
    format: CSV
    recipients:
      - type: email
        target: district-officers@example.com

  - name: "Weekly Ingestion Quality"
    description: "Source quality metrics and rejection analysis"
    dashboard: "Event Volume & Ingestion"
    schedule: "0 17 * * 5"  # Friday 5 PM
    format: PDF
    recipients:
      - type: email
        target: integration-team@example.com
